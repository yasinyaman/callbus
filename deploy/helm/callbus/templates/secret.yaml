{{- include "callbus.checkAuth" . }}
{{- if or .Values.auth.apiKey .Values.auth.apiKeys }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "callbus.authSecret" . }}
  labels: {{- include "callbus.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- with .Values.auth.apiKey }}
  CALLBUS_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.auth.apiKeys }}
  keys.json: {{ toJson . | quote }}
  {{- end }}
{{- end }}
