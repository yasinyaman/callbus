# callbus and its embedding backbone on one GPU host: vLLM serves callbus's LoRA-trained
# Qwen3-Embedding-8B (yasinyaman/callbus-emb-8b at v0.2; no heads needed on it), callbus serves
# your tools in front of it on 127.0.0.1:8765 (MCP at /mcp, REST at /v1). From this directory:
#
#   cp .env.example .env                  # set CALLBUS_API_KEY
#   docker compose run --rm callbus ingest mcp --config /config/callbus.json --out /data
#   docker compose up -d
#
# List your MCP servers in callbus.json (OpenAPI specs: `ingest openapi SPEC --name NAME --out /data`)
# and re-run the ingest line after a change: the running server picks the new catalogue up.
# compose.bundle.yaml runs both in one container instead.
name: callbus-stack

services:
  embedding:
    image: vllm/vllm-openai:v0.30.0
    # FP8 weights, quantized at load: within a point of bf16 in our runs, half the memory. For bf16,
    # drop --quantization and serve as callbus-emb-v0.2 (and set CALLBUS_EMB_MODEL to match). For
    # the base model with the packaged heads: Qwen/Qwen3-Embedding-8B, no --revision, qwen3-emb-fp8.
    command:
      - yasinyaman/callbus-emb-8b
      - --revision=v0.2
      - --served-model-name=callbus-emb-v0.2-fp8
      - --quantization=fp8
      - --runner=pooling
      - --max-model-len=8192
      - --no-enable-chunked-prefill
      - --max-num-batched-tokens=8192
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.9}
    ipc: host
    volumes:
      - models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30m # the first start downloads 16 GB of weights
      start_interval: 10s
    restart: unless-stopped

  callbus:
    image: ghcr.io/yasinyaman/callbus:${CALLBUS_VERSION:-latest}
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
    environment:
      CALLBUS_API_KEY: ${CALLBUS_API_KEY:?set CALLBUS_API_KEY in .env}
      CALLBUS_EMB_URL: http://embedding:8000/v1
      CALLBUS_EMB_MODEL: callbus-emb-v0.2-fp8
      CALLBUS_ALLOWED_HOSTS: callbus
    volumes:
      - data:/data
      - home:/home/callbus # uvx and npx caches, so stdio servers start without a download
      - ./callbus.json:/config/callbus.json:ro
    command: [serve, --data, /data, --config, /config/callbus.json, --host, 0.0.0.0]
    ports:
      - "127.0.0.1:${CALLBUS_PORT:-8765}:8765"
    depends_on:
      embedding:
        condition: service_healthy
    restart: unless-stopped

volumes:
  models:
  data:
  home:
